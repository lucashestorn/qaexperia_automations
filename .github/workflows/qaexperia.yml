name: QA ExperIA
run-name: QA ExperIA ${{ inputs.execution_id }} ${{ github.sha }}
on:
  workflow_dispatch:
    inputs:
      execution_id:
        required: true
      root:
        required: false
        default: '.'
      config:
        required: true
        default: 'playwright.config.ts'
      manager:
        required: true
        default: 'npm'
      framework:
        required: false
        default: 'Playwright'
      language:
        required: false
        default: 'TypeScript'
permissions:
  contents: read
concurrency:
  group: qaex-${{ github.workflow }}-${{ inputs.execution_id || github.run_id }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize execution diagnostics
        env:
          QAEX_EXECUTION_ID: ${{ inputs.execution_id }}
          QAEX_DIAGNOSTICS: ${{ runner.temp }}/qaex-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QAEX_DIAGNOSTICS"
          exec > >(tee -a "$QAEX_DIAGNOSTICS/console.log") 2>&1
          if [[ ! "$QAEX_EXECUTION_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo 'Invalid or missing execution_id'; exit 2
          fi
          node -e 'const fs=require("fs"),p=require("path");fs.writeFileSync(p.join(process.env.QAEX_DIAGNOSTICS,"execution.json"),JSON.stringify({execution_id:process.env.QAEX_EXECUTION_ID,commit_sha:process.env.GITHUB_SHA,run_id:process.env.GITHUB_RUN_ID}))'
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        id: setup
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        id: setup-java
        if: ${{ inputs.language == 'Java' }}
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/setup-python@v5
        id: setup-python
        if: ${{ inputs.language == 'Python' }}
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        id: setup-dotnet
        if: ${{ inputs.language == 'CSharp' }}
        with:
          dotnet-version: '9.0.x'
      - name: Install and run the exact repository snapshot
        id: execution
        env:
          QAEX_ROOT: ${{ inputs.root }}
          QAEX_CONFIG: ${{ inputs.config }}
          QAEX_MANAGER: ${{ inputs.manager }}
          QAEX_FRAMEWORK: ${{ inputs.framework }}
          QAEX_LANGUAGE: ${{ inputs.language }}
          QAEX_DIAGNOSTICS: ${{ runner.temp }}/qaex-evidence
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          QAEX_USER: ${{ secrets.QAEX_USER }}
          QAEX_PASSWORD: ${{ secrets.QAEX_PASSWORD }}
          SECRET_PASSWORD: ${{ secrets.SECRET_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee -a "$QAEX_DIAGNOSTICS/console.log") 2>&1
          phase=preparation
          trap 'code=$?; printf "phase=%s\nexit_code=%s\n" "$phase" "$code" > "$QAEX_DIAGNOSTICS/status.txt"; exit "$code"' EXIT
          case "$QAEX_ROOT" in /*|*..*|*\\*) exit 2;; esac
          cd "$QAEX_ROOT"
          mkdir -p qaex-artifacts
          # Multi-framework execution pipeline
          phase=dependencies
          if [ "$QAEX_LANGUAGE" = "Java" ]; then
            if [ -f pom.xml ]; then
              mvn dependency:resolve -B || true
            elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
              chmod +x ./gradlew 2>/dev/null || true
              ./gradlew dependencies || gradle dependencies || true
            fi
            phase=tests
            if [ -f pom.xml ]; then
              mvn test -B || true
            elif [ -f gradlew ]; then
              ./gradlew test || true
            elif command -v gradle >/dev/null 2>&1; then
              gradle test || true
            fi
            node -e 'const fs=require("fs"),p=require("path");function f(d){let r=[];if(!fs.existsSync(d))return r;for(const i of fs.readdirSync(d,{withFileTypes:true})){const q=p.join(d,i.name);if(i.isDirectory())r=r.concat(f(q));else if(i.name.endsWith(".xml")&&(i.name.startsWith("TEST-")||i.name.includes("test")))r.push(q);}return r;}const xmls=f("target/surefire-reports").concat(f("build/test-results/test"));let exp=0,unexp=0,skp=0;for(const fl of xmls){const c=fs.readFileSync(fl,"utf8");const m=c.match(/<testsuite[^>]*tests="(\d+)"[^>]*failures="(\d+)"[^>]*errors="(\d+)"(?:[^>]*skipped="(\d+)")?/);if(m){const t=parseInt(m[1]||0),fail=parseInt(m[2]||0),err=parseInt(m[3]||0),skip=parseInt(m[4]||0);unexp+=(fail+err);skp+=skip;exp+=(t-fail-err-skip);}}fs.writeFileSync("qaex-artifacts/results.json",JSON.stringify({stats:{expected:exp,unexpected:unexp,skipped:skp,flaky:0}}));'
          elif [ "$QAEX_LANGUAGE" = "Python" ]; then
            if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi
            if [ -f pyproject.toml ]; then pip install . || true; fi
            pip install pytest pytest-json-report || true
            phase=tests
            pytest --json-report --json-report-file=qaex-artifacts/pytest.json || true
            node -e 'const fs=require("fs");let exp=0,unexp=0,skp=0;if(fs.existsSync("qaex-artifacts/pytest.json")){const rep=JSON.parse(fs.readFileSync("qaex-artifacts/pytest.json","utf8"));const s=rep.summary||{};exp=s.passed||0;unexp=(s.failed||0)+(s.error||0);skp=s.skipped||0;}fs.writeFileSync("qaex-artifacts/results.json",JSON.stringify({stats:{expected:exp,unexpected:unexp,skipped:skp,flaky:0}}));'
          elif [ "$QAEX_LANGUAGE" = "CSharp" ]; then
            dotnet restore || true
            phase=tests
            dotnet test --logger:"trx;LogFileName=results.trx" -r qaex-artifacts || true
            node -e 'const fs=require("fs"),p=require("path");let exp=0,unexp=0,skp=0;const trxPath=p.join("qaex-artifacts","results.trx");if(fs.existsSync(trxPath)){const c=fs.readFileSync(trxPath,"utf8");const m=c.match(/<Counters[^>]*total="(\d+)"[^>]*executed="(\d+)"[^>]*passed="(\d+)"[^>]*failed="(\d+)"[^>]*error="(\d+)"/);if(m){exp=parseInt(m[3]||0);unexp=parseInt(m[4]||0)+parseInt(m[5]||0);skp=parseInt(m[1]||0)-parseInt(m[2]||0);}}fs.writeFileSync("qaex-artifacts/results.json",JSON.stringify({stats:{expected:exp,unexpected:unexp,skipped:skp,flaky:0}}));'
          elif [ "$QAEX_FRAMEWORK" = "Cypress" ]; then
            case "$QAEX_MANAGER" in
              npm) if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
              pnpm) corepack enable; pnpm install --frozen-lockfile ;;
              yarn) corepack enable; yarn install --immutable ;;
              *) exit 2 ;;
            esac
            phase=tests
            npx cypress run --reporter json --reporter-options toConsole=false,outputFile=qaex-artifacts/cypress.json || true
            node -e 'const fs=require("fs");let exp=0,unexp=0,skp=0;if(fs.existsSync("qaex-artifacts/cypress.json")){const rep=JSON.parse(fs.readFileSync("qaex-artifacts/cypress.json","utf8"));exp=rep.totalPassed||rep.stats?.passes||0;unexp=rep.totalFailed||rep.stats?.failures||0;skp=rep.totalPending||rep.totalSkipped||rep.stats?.pending||0;}fs.writeFileSync("qaex-artifacts/results.json",JSON.stringify({stats:{expected:exp,unexpected:unexp,skipped:skp,flaky:0}}));'
          else
            case "$QAEX_MANAGER" in
            npm) if [ -f package-lock.json ]; then npm ci; else npm install; fi ;;
            pnpm) corepack enable; pnpm install --frozen-lockfile ;;
            yarn) corepack enable; yarn install --immutable ;;
            *) exit 2 ;;
          esac
          phase=validation
          node -e 'const p=require("./package.json"),cp=require("child_process");for(const name of ["typecheck","lint"]){if(p.scripts?.[name]){const r=cp.spawnSync(process.env.QAEX_MANAGER,["run",name],{stdio:"inherit"});if(r.status!==0)process.exit(r.status||1)}}'
          phase=browsers
          if grep -rq --exclude-dir=node_modules "\bpage\b" "$QAEX_ROOT" 2>/dev/null; then
            npx --no-install playwright install chromium
          else
            echo "Skipping playwright browser binaries install: pure API test"
          fi
          phase=integrity
          node -e 'const fs=require("fs"),p=require("path"),c=require("crypto");const m=JSON.parse(fs.readFileSync(p.join(process.env.GITHUB_WORKSPACE,".qaex-manifest.json"),"utf8"));for(const [f,h] of Object.entries(m)){if(c.createHash("sha256").update(fs.readFileSync(p.join(process.env.GITHUB_WORKSPACE,f))).digest("hex")!==h)throw Error("Snapshot changed: "+f)}'
          phase=tests
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/qaex-artifacts/results.json" npx --no-install playwright test --config="$QAEX_CONFIG" --reporter=list,json
          fi
      - name: Require actual tests without failures or skips
        env:
          QAEX_ROOT: ${{ inputs.root }}
        run: |
          node -e 'const fs=require("fs"),p=require("path"),c=require("crypto");const m=JSON.parse(fs.readFileSync(p.join(process.env.GITHUB_WORKSPACE,".qaex-manifest.json"),"utf8"));for(const [f,h] of Object.entries(m)){if(c.createHash("sha256").update(fs.readFileSync(p.join(process.env.GITHUB_WORKSPACE,f))).digest("hex")!==h)throw Error("Snapshot changed: "+f)}'
          node -e 'const fs=require("fs"),p=require("path");const s=JSON.parse(fs.readFileSync(p.join(process.env.QAEX_ROOT,"qaex-artifacts/results.json"),"utf8")).stats;if(!s||s.expected<1||s.unexpected||s.skipped||s.flaky)process.exit(1)'
      - name: Record preparation outcomes
        if: always()
        env:
          QAEX_STEP_OUTCOMES: ${{ toJSON(steps) }}
          QAEX_DIAGNOSTICS: ${{ runner.temp }}/qaex-evidence
        shell: bash
        run: |
          mkdir -p "$QAEX_DIAGNOSTICS"
          printf '%s\n' "$QAEX_STEP_OUTCOMES" > "$QAEX_DIAGNOSTICS/steps.json"
      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qaex-evidence
          path: |
            ${{ runner.temp }}/qaex-evidence/
            ${{ inputs.root }}/package-lock.json
            ${{ inputs.root }}/pnpm-lock.yaml
            ${{ inputs.root }}/yarn.lock
            ${{ inputs.root }}/qaex-artifacts/
            ${{ inputs.root }}/test-results/
            ${{ inputs.root }}/playwright-report/
          if-no-files-found: ignore